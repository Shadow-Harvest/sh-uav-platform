# Mac-specific overrides for hybrid setup:
# - Gazebo runs natively on Mac (Metal GPU)
# - SITL, MAVROS, ROS2 run in this container
services:
  dev:
    # On Mac, network_mode: host doesn't work
    # Use bridge network with port mapping
    network_mode: bridge

    # Expose ports for communication with native Gazebo
    ports:
      # ArduPilot FDM protocol (SITL <-> Gazebo)
      - "9002:9002/udp"   # FDM in (actuator commands)
      - "9003:9003/udp"   # FDM out (sensor data)
      # MAVLink (GCS <-> SITL)
      - "14550:14550/udp"
      - "14540:14540/udp"

    # Allow container to reach Mac host
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # No display/X11 needed - Gazebo runs natively on Mac
    environment:
      - ROS_DOMAIN_ID=42
