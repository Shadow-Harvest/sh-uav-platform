[pytest]
testpaths = src/uav_control/test/unit  # ← Only look in unit/ folder

python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests (fast, no dependencies, MacBook-friendly)
    integration: Integration tests (requires ROS/MAVROS, PC only)
    slow: Tests that take significant time

addopts = --strict-markers -v

